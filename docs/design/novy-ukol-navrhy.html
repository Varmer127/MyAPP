<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept: nový úkol, návrhy</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--pg:#ececf1;--pt:#111;--ps:#555;--pb:#fff;--pl:#cfcfd6}
@media (prefers-color-scheme:dark){:root{--pg:#161618;--pt:#f2f2f2;--ps:#a0a0a8;--pb:#232326;--pl:#38383c}}
body{margin:0;background:var(--pg);color:var(--pt);font-family:-apple-system,system-ui,"SF Pro Text",sans-serif;padding:24px 16px 48px;display:flex;flex-direction:column;align-items:center}
h1{font-size:20px;margin:0 0 4px}
p.lead{font-size:14px;color:var(--ps);margin:0 0 16px;text-align:center;max-width:520px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;justify-content:center}
.sw button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--pb);color:var(--pt);border:1px solid var(--pl);cursor:pointer}
.sw button.on{background:var(--pt);color:var(--pg);border-color:var(--pt)}
.stage{margin-top:12px}
.k{--bg:#0b0b0c;--card:#161618;--raised:#232326;--line:#2a2a2d;--t1:#fff;--t2:#9a9aa0;--t3:#66666b;--on:#0b0b0c;--green:#30d158;--orange:#ff9f0a;--red:#ff453a}
.k.l{--bg:#f2f2f6;--card:#fff;--raised:#e9e9ee;--line:#dcdce2;--t1:#0b0b0c;--t2:#6b6b72;--t3:#9b9ba2;--on:#fff;--green:#1fa844;--orange:#c86f00;--red:#d6342a}
.ph{width:340px;height:700px;background:var(--bg);color:var(--t1);border-radius:40px;border:8px solid #000;box-shadow:0 0 0 1px var(--pl);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ph *{box-sizing:border-box}
.ph input,.ph textarea{background:transparent;border:0;outline:0;color:var(--t1);font:inherit;width:100%;padding:0;resize:none}
.ph input::placeholder,.ph textarea::placeholder{color:var(--t3)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 0;flex:none}
.lab{font-size:11px;letter-spacing:.14em;color:var(--t2);font-weight:600}
.x{width:30px;height:30px;border-radius:50%;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--t2)}
.body{padding:14px 20px 16px;flex:1;overflow-y:auto;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.title input{font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.chips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--t1);display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.chip.on{background:var(--t1);color:var(--on);border-color:var(--t1)}
.chip.ac{border-color:var(--t1)}
.chip i{font-size:15px}
.ic{display:flex;gap:8px;margin-top:16px;justify-content:space-between}
.ic div{flex:1;text-align:center;font-size:10.5px;color:var(--t2);cursor:pointer}
.ic b{display:flex;width:100%;max-width:44px;height:44px;margin:0 auto 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-items:center;justify-content:center;font-size:20px;color:var(--t1)}
.ic .on b{background:var(--t1);color:var(--on);border-color:var(--t1)}
.ic .on{color:var(--t1)}
.days{display:flex;gap:6px;margin-top:14px}
.days div{flex:1;text-align:center;padding:7px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:11px;color:var(--t2);cursor:pointer}
.days div b{display:block;font-size:16px;color:var(--t1);margin-top:1px}
.days .on{background:var(--t1);border-color:var(--t1);color:var(--on)}
.days .on b{color:var(--on)}
.ed{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.ed .h{font-size:10.5px;letter-spacing:.14em;color:var(--t2);font-weight:600;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.row small{display:block;font-size:11.5px;color:var(--t2);margin-top:1px;line-height:1.3}
.sub{color:var(--t2)}
.tg{width:46px;height:28px;border-radius:14px;background:var(--raised);position:relative;flex:none;cursor:pointer;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}
.tg.on::after{left:21px}
.st{display:flex;align-items:center;gap:8px}
.st button{width:32px;height:32px;border-radius:50%;padding:0;font-size:17px;line-height:1;background:var(--raised);border:0;color:var(--t1);cursor:pointer}
.st b{min-width:54px;text-align:center;font-size:17px;font-weight:700}
.seg{display:flex;background:var(--raised);border-radius:12px;padding:3px}
.seg div{flex:1;text-align:center;font-size:12.5px;padding:7px 0;border-radius:9px;color:var(--t2);cursor:pointer;font-weight:600}
.seg .on{background:var(--t1);color:var(--on)}
.field{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.field label{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--t2);font-weight:600;margin-bottom:3px;text-transform:uppercase}
.field input,.field textarea{font-size:14.5px}
.more{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--t2);display:flex;justify-content:space-between;cursor:pointer}
.cta{margin:8px 20px 20px;background:var(--t1);color:var(--on);border-radius:16px;height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.06em;font-size:14px;flex:none;cursor:pointer}
.sent{font-size:23px;font-weight:800;line-height:1.6}
.tok{display:inline-block;padding:0 10px;border-radius:12px;background:var(--raised);border:1.5px solid transparent;cursor:pointer;line-height:1.3;margin:1px 0}
.tok.on{border-color:var(--t1);background:var(--card)}
.tok.dim{font-size:14px;font-weight:600;color:var(--t2);padding:3px 10px;border:1.5px dashed var(--line);background:transparent}
.tok.dim.on{border-color:var(--t1);color:var(--t1)}
.tl{position:relative;margin:14px 0 0 34px;border-left:1px solid var(--line);touch-action:none}
.hr{position:absolute;left:-34px;font-size:10px;color:var(--t3);width:28px;text-align:right;transform:translateY(-7px)}
.ln{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ev{position:absolute;left:8px;right:8px;border-radius:9px;padding:4px 9px;font-size:11.5px;background:var(--raised);color:var(--t2);overflow:hidden;line-height:1.25}
.nw{position:absolute;left:8px;right:8px;border-radius:11px;padding:6px 10px;font-size:12.5px;font-weight:700;background:var(--green);color:#04210d;cursor:grab;touch-action:none;overflow:hidden;user-select:none}
.nw.bad{background:var(--orange);color:#2b1500}
.nw small{display:block;font-weight:500;font-size:11px;opacity:.85}
.hd{position:absolute;left:50%;bottom:3px;width:30px;height:6px;margin-left:-15px;border-radius:3px;background:rgba(0,0,0,.35);cursor:ns-resize;touch-action:none}
.warn{font-size:12px;color:var(--orange);margin-top:8px;line-height:1.35}
.ok{font-size:12px;color:var(--t2);margin-top:8px}
.hint{font-size:11.5px;color:var(--t3);margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<h1>Nový úkol: tři návrhy</h1>
<p class="lead">Všechno je klikací. Deadline, délka, priorita, váha i sázka se dají nastavit. Ve variantě C se blok na ose dá táhnout.</p>
<div class="sw" id="sw"></div>
<div class="sw" id="th"></div>
<div class="stage"><div class="k" id="k"><div class="ph" id="ph"></div></div></div>
<script>
var S={cur:0,light:false,title:'Gym: záda a biceps',day:0,hasDl:true,dl:1080,dur:60,pr:2,cat:0,more:false,wc:false,w:3,focus:false,proof:false,rec:false,stake:'',cue:'',why:'',notes:'',open:null,tok:0,added:false};
var cats=[["ti-barbell","Gym"],["ti-run","Sport"],["ti-briefcase","Práce"],["ti-book","Učení"],["ti-heart","Zdraví"],["ti-dots","Jiné"]];
var days=[["Dnes","26"],["Út","27"],["St","28"],["Čt","29"],["Pá","30"]];
var prs=["Nízká","Střední","Vysoká","Kritická"],basePts=[1,2,4,5];
var evs=[{s:960,e:1005,t:"Schůzka (kalendář)"},{s:1140,e:1200,t:"Večeře s rodinou"}];
function ti(c){return '<i class="ti '+c+'" aria-hidden="true"></i>'}
function ft(m){return Math.floor(m/60)+':'+('0'+(m%60)).slice(-2)}
function fd(m){var h=Math.floor(m/60),r=m%60;return h?(r?h+' h '+r+' min':h+' h'):r+' min'}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function tg(a,on){return '<span class="tg'+(on?' on':'')+'" data-a="'+a+'" role="switch" aria-checked="'+on+'"></span>'}
function stepper(a,txt){return '<span class="st"><button data-a="'+a+'-" aria-label="méně">−</button><b>'+txt+'</b><button data-a="'+a+'+" aria-label="více">+</button></span>'}
function dayStrip(){return '<div class="days">'+days.map(function(d,i){return '<div class="'+(i==S.day?'on':'')+'" data-a="day'+i+'">'+d[0]+'<b>'+d[1]+'</b></div>'}).join('')+'</div>'}
function catRow(){return '<div class="ic">'+cats.map(function(c,i){return '<div class="'+(i==S.cat?'on':'')+'" data-a="cat'+i+'"><b>'+ti(c[0])+'</b>'+c[1]+'</div>'}).join('')+'</div>'}
function seg(a,arr,sel,st){return '<div class="seg"'+(st?' style="'+st+'"':'')+'>'+arr.map(function(x,i){return '<div class="'+(i==sel?'on':'')+'" data-a="'+a+i+'">'+x+'</div>'}).join('')+'</div>'}
function edDl(){return '<div class="ed"><div class="h">DEADLINE</div><div class="row"><span>Použít deadline<small>Úkol se ohlásí před koncem</small></span>'+tg('dltg',S.hasDl)+'</div>'+(S.hasDl?'<div class="row"><span class="sub">Hotovo do</span>'+stepper('dl',ft(S.dl))+'</div>':'')+'</div>'}
function edDur(){var q=[15,30,45,60,90,120];return '<div class="ed"><div class="h">DÉLKA</div><div class="chips" style="margin:0 0 8px">'+q.map(function(m){return '<span class="chip'+(S.dur==m?' on':'')+'" data-a="dur'+m+'">'+(m<60?m+' min':m==60?'1 h':m==90?'1,5 h':'2 h')+'</span>'}).join('')+'</div><div class="row"><span class="sub">Přesně</span>'+stepper('du',fd(S.dur))+'</div></div>'}
function edPr(){return '<div class="ed"><div class="h">PRIORITA</div>'+seg('pr',prs,S.pr)+'<div class="hint">Váha úkolu vychází z priority: '+basePts[S.pr]+' b.</div></div>'}
function edBy(k){return k=='dl'?edDl():k=='dur'?edDur():k=='pr'?edPr():''}
function propChips(){
 var items=[['dl',ti('ti-clock')+(S.hasDl?'do '+ft(S.dl):'bez deadlinu')],['dur',ti('ti-hourglass')+fd(S.dur)],['pr',ti('ti-flag')+prs[S.pr]]];
 return '<div class="chips">'+items.map(function(x){return '<span class="chip'+(S.open==x[0]?' ac':'')+'" data-a="open'+x[0]+'">'+x[1]+'</span>'}).join('')+'</div>'+edBy(S.open)}
function fld(k,lab,ph){return '<div class="field"><label>'+lab+'</label><textarea rows="2" data-f="'+k+'" placeholder="'+ph+'">'+esc(S[k])+'</textarea></div>'}
function detailsSwitches(){
 return '<div class="ed" style="margin-top:12px"><div class="h">BODY A REŽIM</div>'+
 '<div class="row"><span>Váha<small>'+(S.wc?'Vlastní hodnota':'Automaticky z priority a kategorie')+'</small></span>'+(S.wc?stepper('w',S.w):'<b>'+basePts[S.pr]+'</b>')+'</div>'+
 '<div class="row">'+seg('wc',['Automaticky','Vlastní'],S.wc?1:0,'width:100%')+'</div>'+
 '<div class="row"><span>Focus timer<small>Stopky při plnění</small></span>'+tg('focus',S.focus)+'</div>'+
 '<div class="row"><span>Vyžadovat důkaz<small>Fotka nebo poznámka před splněním</small></span>'+tg('proof',S.proof)+'</div>'+
 '<div class="row"><span>Recovery úkol<small>Práce navíc po špatném dni</small></span>'+tg('rec',S.rec)+'</div></div>'}
function stakeFields(){return fld('stake','Sázka','Co se stane, když to nesplním')+fld('cue','Kdy to začnu','Když dopiju kávu, začnu číst')+fld('why','Proč na tom záleží','Tvůj vlastní důvod')}
function more(){return '<div class="more" data-a="more"><span>Sázka, spouštěč, proč, váha…</span><span>'+(S.more?'Skrýt':'Víc')+'</span></div>'+(S.more?detailsSwitches()+stakeFields()+fld('notes','Poznámky','Volitelné'):'')}
function hdr(){return '<div class="grab"></div><div class="top"><span class="lab">NOVÝ SLIB</span><span class="x">✕</span></div>'}
function cta(){return '<div class="cta" data-a="add">'+(S.added?'PŘIDÁNO DO PLÁNU ✓':'PŘIDAT DO PLÁNU')+'</div>'}
function titleIn(sz){return '<div class="title"><input data-f="title" placeholder="Co slibuješ?" value="'+esc(S.title)+'"'+(sz?' style="font-size:'+sz+'px"':'')+'></div>'}
function A(){return hdr()+'<div class="body">'+titleIn()+dayStrip()+propChips()+catRow()+more()+'</div>'+cta()}
function sentence(){
 var t=function(i,x){return '<span class="tok'+(S.tok==i?' on':'')+'" data-a="tok'+i+'">'+esc(x)+'</span>'};
 var d=function(i,x){return '<span class="tok dim'+(S.tok==i?' on':'')+'" data-a="tok'+i+'">'+x+'</span>'};
 return '<div class="sent">Slibuji, že '+t(0,(S.title||'…'))+' '+t(1,days[S.day][0].toLowerCase()+(S.day?' '+days[S.day][1]+'.':''))+' '+t(2,(S.hasDl?'do '+ft(S.dl):'kdykoli')+' na '+fd(S.dur))+', priorita '+t(3,prs[S.pr].toLowerCase())+'.</div><div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">'+d(4,'+ jinak…')+d(5,'+ ještě…')+'</div>'}
function panelB(){
 if(S.tok==0)return '<div class="ed"><div class="h">CO</div>'+titleIn(18)+catRow()+'</div>';
 if(S.tok==1)return '<div class="ed"><div class="h">KDY</div>'+dayStrip().replace('margin-top:14px','')+'</div>';
 if(S.tok==2)return edDl()+edDur();
 if(S.tok==3)return edPr();
 if(S.tok==4)return stakeFields();
 return detailsSwitches()+fld('notes','Poznámky','Volitelné')}
function B(){return hdr()+'<div class="body">'+sentence()+'<div style="margin-top:12px">'+panelB()+'</div></div>'+cta()}
var T0=900,PX=44,HRS=6;
function clash(){var s=S.dl-S.dur;return S.hasDl?evs.filter(function(e){return s<e.e&&S.dl>e.s}):[]}
function nwHtml(){var s=S.dl-S.dur,bad=clash().length>0;
 if(!S.hasDl)return '';
 return '<div class="nw'+(bad?' bad':'')+'" id="nw" style="top:'+(s-T0)/60*PX+'px;height:'+S.dur/60*PX+'px"><span id="nwt">'+esc(S.title||'Úkol')+'</span><small id="nws">'+ft(s)+' – '+ft(S.dl)+'</small><span class="hd" id="hd"></span></div>'}
function msgC(){if(!S.hasDl)return '<div class="ok">Bez deadlinu je úkol jen na ten den, bez času.</div>';var c=clash();return c.length?'<div class="warn">Kryje se s kalendářem: '+c.map(function(e){return e.t+' '+ft(e.s)+'–'+ft(e.e)}).join(', ')+'.</div>':'<div class="ok">Čas je volný, nic se nekryje.</div>'}
function C(){
 var lines='',hrs='';for(var h=0;h<=HRS;h++){hrs+='<span class="hr" style="top:'+h*PX+'px">'+(T0/60+h)+'</span>';lines+='<div class="ln" style="top:'+h*PX+'px"></div>'}
 var ev=evs.map(function(e){return '<div class="ev" style="top:'+(e.s-T0)/60*PX+'px;height:'+(e.e-e.s)/60*PX+'px">'+e.t+'<br>'+ft(e.s)+' – '+ft(e.e)+'</div>'}).join('');
 return hdr()+'<div class="body">'+titleIn(22)+dayStrip()+
 '<div class="row" style="margin-top:6px;padding-bottom:0"><span>Použít deadline<small>Konec bloku = deadline. Táhni blok, nebo jeho spodní úchyt.</small></span>'+tg('dltg',S.hasDl)+'</div>'+
 '<div class="tl" id="tl" style="height:'+HRS*PX+'px">'+hrs+lines+ev+nwHtml()+'</div>'+
 '<div id="msg">'+msgC()+'</div>'+
 '<div class="chips"><span class="chip'+(S.open=='dur'?' ac':'')+'" data-a="opendur">'+ti('ti-hourglass')+fd(S.dur)+'</span><span class="chip'+(S.open=='pr'?' ac':'')+'" data-a="openpr">'+ti('ti-flag')+prs[S.pr]+'</span></div>'+edBy(S.open=='dl'?null:S.open)+catRow()+more()+'</div>'+cta()}
var F=[A,B,C],N=["A · Slib jednou větou","B · Věta ze slov","C · Den na ose"];
function draw(){
 var ph=document.getElementById('ph'),keep=ph.querySelector('.body');var st=keep?keep.scrollTop:0;
 ph.innerHTML=F[S.cur]();
 var nb=ph.querySelector('.body');if(nb)nb.scrollTop=st;
 document.getElementById('k').className='k'+(S.light?' l':'');
 document.getElementById('sw').innerHTML=N.map(function(n,i){return '<button class="'+(i==S.cur?'on':'')+'" data-a="v'+i+'">'+n+'</button>'}).join('');
 document.getElementById('th').innerHTML=['Tmavý','Světlý'].map(function(n,i){return '<button class="'+((i==1)==S.light?'on':'')+'" data-a="t'+i+'">'+n+'</button>'}).join('');
 bindDrag();
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function act(a){var m;
 if(m=a.match(/^v(\d)$/)){S.cur=+m[1];S.open=null;S.tok=0}
 else if(m=a.match(/^t(\d)$/)){S.light=m[1]==1}
 else if(m=a.match(/^day(\d)$/)){S.day=+m[1]}
 else if(m=a.match(/^cat(\d)$/)){S.cat=+m[1]}
 else if(m=a.match(/^pr(\d)$/)){S.pr=+m[1]}
 else if(m=a.match(/^tok(\d)$/)){S.tok=+m[1]}
 else if(m=a.match(/^open(\w+)$/)){S.open=S.open==m[1]?null:m[1]}
 else if(m=a.match(/^dur(\d+)$/)){S.dur=+m[1]}
 else if(a=='more')S.more=!S.more;
 else if(a=='dltg')S.hasDl=!S.hasDl;
 else if(a=='focus')S.focus=!S.focus;else if(a=='proof')S.proof=!S.proof;else if(a=='rec')S.rec=!S.rec;
 else if(a=='dl+')S.dl=clamp(S.dl+15,T0+S.dur,1439);
 else if(a=='dl-')S.dl=clamp(S.dl-15,T0+S.dur,1439);
 else if(a=='du+')S.dur=clamp(S.dur+15,15,240);else if(a=='du-')S.dur=clamp(S.dur-15,15,240);
 else if(a=='w+')S.w=clamp(S.w+1,1,5);else if(a=='w-')S.w=clamp(S.w-1,1,5);
 else if(a=='wc0')S.wc=false;else if(a=='wc1')S.wc=true;
 else if(a=='add'){S.added=true;draw();setTimeout(function(){S.added=false;draw()},1400);return}
 if(S.cur==2&&S.hasDl){S.dl=clamp(S.dl,T0+S.dur,T0+HRS*60)}
 draw()}
document.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(t)act(t.dataset.a)});
document.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.f;if(f){S[f]=e.target.value;var n=document.getElementById('nwt');if(n)n.textContent=S.title||'Úkol'}});
function bindDrag(){
 var nw=document.getElementById('nw');if(!nw)return;
 var hd=document.getElementById('hd');
 function paint(){var s=S.dl-S.dur;nw.style.top=(s-T0)/60*PX+'px';nw.style.height=S.dur/60*PX+'px';document.getElementById('nws').textContent=ft(s)+' – '+ft(S.dl);nw.className='nw'+(clash().length?' bad':'');document.getElementById('msg').innerHTML=msgC()}
 function drag(el,mode){
  el.addEventListener('pointerdown',function(ev){ev.preventDefault();ev.stopPropagation();el.setPointerCapture(ev.pointerId);
   var y0=ev.clientY,dl0=S.dl,du0=S.dur;
   function mv(e2){var dm=Math.round((e2.clientY-y0)/PX*60/15)*15;
    if(mode=='move'){S.dl=clamp(dl0+dm,T0+S.dur,T0+HRS*60)}
    else{var end=clamp(dl0+dm,dl0-du0+15,T0+HRS*60);S.dl=end;S.dur=end-(dl0-du0)}
    paint()}
