<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kept: Dnes, Týden, Statistiky</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--pg:#ececf1;--pt:#111;--ps:#555;--pb:#fff;--pl:#cfcfd6}
@media (prefers-color-scheme:dark){:root{--pg:#161618;--pt:#f2f2f2;--ps:#a0a0a8;--pb:#232326;--pl:#38383c}}
body{margin:0;background:var(--pg);color:var(--pt);font-family:-apple-system,system-ui,sans-serif;padding:24px 16px 60px}
h1{font-size:20px;margin:0 0 4px;text-align:center}
p.lead{font-size:14px;color:var(--ps);margin:0 auto 14px;text-align:center;max-width:560px}
.sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.sw button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;background:var(--pb);color:var(--pt);border:1px solid var(--pl);cursor:pointer}
.sw button.on{background:var(--pt);color:var(--pg);border-color:var(--pt)}
.note{max-width:560px;margin:0 auto 14px;font-size:13.5px;color:var(--ps);text-align:center;min-height:38px}
.stage{display:flex;justify-content:center}
.k{--bg:#0b0b0c;--card:#161618;--raised:#232326;--line:#2a2a2d;--t1:#fff;--t2:#9a9aa0;--t3:#66666b;--on:#0b0b0c;--green:#30d158;--orange:#ff9f0a;--red:#ff453a}
.k.l{--bg:#f2f2f6;--card:#fff;--raised:#e9e9ee;--line:#dcdce2;--t1:#0b0b0c;--t2:#6b6b72;--t3:#9b9ba2;--on:#fff;--green:#1fa844;--orange:#c86f00;--red:#d6342a}
.ph{width:350px;height:740px;background:var(--bg);color:var(--t1);border-radius:42px;border:8px solid #000;position:relative;overflow:hidden;display:flex;flex-direction:column}
.ph *{box-sizing:border-box}
.scr{flex:1;overflow-y:auto;padding:18px 18px 90px;scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
.tab{position:absolute;left:12px;right:12px;bottom:12px;height:58px;border-radius:29px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;font-size:10px;color:var(--t2)}
.tab div{text-align:center}.tab i{display:block;font-size:20px;margin-bottom:1px}.tab .on{color:var(--t1)}
.lab{font-size:11px;letter-spacing:.14em;color:var(--t2);font-weight:600;text-transform:uppercase}
.h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.bell{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;position:relative}
.bell b{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px}
.flame{color:var(--orange);text-align:center;font-weight:800;font-size:13px;line-height:1}
.flame i{font-size:24px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.btn{background:var(--t1);color:var(--on);border-radius:14px;height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.05em;font-size:13px}
.btn.g{background:var(--green);color:#03210c}
.btn.s{background:var(--raised);color:var(--t1)}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.task:last-child{border-bottom:0}
.task .ic{width:34px;height:34px;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:17px}
.task small{display:block;color:var(--t2);font-size:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--t3);flex:none}
.chk.d{background:var(--green);border-color:var(--green);display:flex;align-items:center;justify-content:center;color:#03210c;font-size:15px}
.done{color:var(--t3);text-decoration:line-through}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--raised);color:var(--t1)}
.carousel{display:flex;gap:10px;overflow-x:auto;margin:14px -18px 0;padding:0 18px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:12.5px;color:var(--t2)}
.mini b{display:block;color:var(--t1);font-size:13.5px;margin:6px 0 2px}
.mini i{font-size:20px;color:var(--t1)}
.ring{width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--green) 0 60%,var(--raised) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring div{width:96px;height:96px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:28px}
.ring span{font-size:11px;color:var(--t2)}
.tl{position:relative;margin-top:10px;padding-left:56px}
.tl .t{position:absolute;left:0;width:44px;text-align:right;font-size:11px;color:var(--t3)}
.tl .ln{position:absolute;left:52px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .now{position:absolute;left:46px;right:0;height:2px;background:var(--red)}
.tl .now:before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px}
.slot small{display:block;color:var(--t2);font-size:12px}
.slot.d{opacity:.55}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0 10px;text-align:center;font-size:11px;color:var(--t2)}
.day b{display:block;font-size:16px;color:var(--t1);margin:2px 0 6px}
.dots{display:flex;flex-direction:column;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--raised)}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.o{background:var(--t2)}
.day.sel{border-color:var(--t1)}
.bar{height:8px;border-radius:4px;background:var(--raised);overflow:hidden;margin-top:6px}
.bar div{height:100%;background:var(--t1)}
.stat{font-size:28px;font-weight:800}
.cap{font-size:12.5px;color:var(--t2);margin-top:2px;line-height:1.35}
.why{font-size:11px;color:var(--t3);margin-top:8px;line-height:1.35;border-top:1px dashed var(--line);padding-top:8px}
.cgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}
.cgrid div{aspect-ratio:1;border-radius:3px;background:var(--raised)}
.cgrid .g{background:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{margin-top:10px}
.agday{margin-top:14px}
.agday .hd{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--t2);font-weight:600;padding:4px 2px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--raised);border-radius:10px;padding:2px;margin-top:14px}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--t1);padding:7px 0;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{background:var(--raised);border-radius:14px;padding:10px;min-height:104px;font-size:11px;color:var(--t2);line-height:1.3}
.tile i{font-size:18px;color:var(--t1)}
.tile b{display:block;color:var(--t1);font-size:12.5px;margin:10px 0 2px}
.hrs{display:flex;align-items:flex-end;gap:4px;height:60px;margin-top:10px}
.hrs div{flex:1;background:var(--green);border-radius:3px}
.lseg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);margin-top:14px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--raised) 80%,transparent);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}
.lseg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 2px rgba(0,0,0,.25),0 6px 16px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px) saturate(1.8);backdrop-filter:blur(6px) saturate(1.8);transition:transform .55s cubic-bezier(.3,1.35,.45,1)}
.k.l .lseg .knob{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.7));border-color:rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(0,0,0,.14)}
.lseg .knob.squish{animation:squish .55s cubic-bezier(.3,1.2,.4,1)}
@keyframes squish{0%{scale:1 1}35%{scale:1.22 .86}65%{scale:.96 1.05}100%{scale:1 1}}
.lseg button{position:relative;z-index:1;font:inherit;font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--t2);padding:8px 0;border-radius:999px;cursor:pointer;transition:color .3s,transform .2s}
.lseg button.on{color:var(--t1)}
.lseg button:active{transform:scale(1.08)}
.anim{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.day{cursor:pointer}.day.today b{color:var(--orange)}
.ib{width:32px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:17px;cursor:pointer}
.ib.dis{opacity:.3}
.dash{border:1px dashed var(--t3);border-radius:12px;padding:12px;margin-top:10px;font-size:13.5px;color:var(--t2);font-weight:600}
.lrow{display:flex;align-items:center;gap:10px;padding:13px 16px;font-size:13.5px}
.lrow i{font-size:17px;color:var(--t2)}
.sticky{position:sticky;bottom:0;padding:14px 0 4px;background:linear-gradient(transparent,var(--bg) 35%)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin-top:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:11.5px;color:var(--t2)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.legend b{color:var(--t1)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;font-size:11px;text-align:center}
.mgrid span{color:var(--t3);font-size:10px}
.mgrid div{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--raised);color:var(--t2);cursor:pointer}
.mgrid .g{background:var(--green);color:#03210c;font-weight:600}
.mgrid .x{background:color-mix(in srgb,var(--red) 30%,var(--raised));color:var(--t1)}
.mgrid .f{background:transparent;border:1px solid var(--line);color:var(--t3)}
.mgrid .e{background:transparent}
.mgrid .t{outline:2px solid var(--t1);outline-offset:1px}
.mgrid div i{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ygrid div{border-radius:10px;padding:8px 6px;font-size:11px;color:var(--t1);text-align:center;cursor:pointer;border:2px solid transparent}
.ygrid div b{display:block;font-size:12px}
.ygrid .f{background:transparent;border:1px dashed var(--line);color:var(--t3)}
.ygrid .sel{border-color:var(--t1)}
.expand{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);animation:rise .35s ease both}
</style>
</head>
<body>
<h1>Dnes, Týden a Statistiky: návrhy</h1>
<p class="lead">Jen prototypy, v aplikaci se nic nemění. Přepínej varianty a vzhled. Pod každou variantou je, co se proti dnešku mění.</p>
<div class="sw" id="screens"></div>
<div class="sw" id="variants"></div>
<div class="sw" id="theme"></div>
<div class="note" id="note"></div>
<div class="stage"><div class="k" id="k"><div class="ph"><div class="scr" id="scr"></div><div class="tab" id="tab"></div></div></div></div>
<script>
var state={screen:0,variant:0,light:false,week:0,pweek:0,period:1,pperiod:1,day:5,nday:0,sent:false,month:10,ymonth:10};
function ic(n){return '<i class="ti ti-'+n+'" aria-hidden="true"></i>'}
function tabbar(active){var t=[['sun','Dnes'],['calendar','Týden'],['chart-bar','Statistiky'],['heart','Zdraví'],['settings','Nastavení']];return t.map(function(x,i){return '<div class="'+(i==active?'on':'')+'">'+ic(x[0])+x[1]+'</div>'}).join('')}
function head(kicker,title,flame){return '<div class="row"><div><div class="lab">'+kicker+'</div><div class="h1">'+title+'</div></div><div class="sp"></div><div class="bell">'+ic('bell')+'<b>2</b></div>'+(flame?'<div class="flame">'+ic('flame')+'5</div>':'')+'</div>'}
function task(icon,title,meta,done){return '<div class="task"><div class="ic">'+ic(icon)+'</div><div class="sp'+(done?' done':'')+'">'+title+'<small>'+meta+'</small></div><div class="chk'+(done?' d':'')+'">'+(done?ic('check'):'')+'</div></div>'}
function lseg(key,labels,cur,prev){return '<div class="lseg" style="--n:'+labels.length+'"><div class="knob" data-from="'+prev+'" data-to="'+cur+'"></div>'+labels.map(function(x,i){return '<button data-'+key+'="'+i+'" class="'+(i==cur?'on':'')+'">'+x+'</button>'}).join('')+'</div>'}
var MN=['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'],MP=[72,75,70,81,78,74,69,80,91,86,84,null];
function dayState(m,d){if(m>10||(m==10&&d>7))return 'f';var h=(d*37+m*11)%100;return h<(MP[m]||84)?'g':'x'}
function monthGrid(m){var first=(new Date(2026,m,1).getDay()+6)%7,len=new Date(2026,m+1,0).getDate(),h='<div class="mgrid">'+['Po','Út','St','Čt','Pá','So','Ne'].map(function(x){return '<span>'+x+'</span>'}).join('');for(var i=0;i<first;i++)h+='<div class="e"></div>';
 for(var d=1;d<=len;d++){var st=dayState(m,d);h+='<div class="'+st+(m==10&&d==7?' t':'')+'">'+d+((d*13+m)%9==0&&st!='f'?'<i></i>':'')+'</div>'}return h+'</div>'}
function consistency(P){if(P==1){var w=['g','x','g','g','g','t','f'];return '<div class="stat">4 z 5 dní</div><div class="mgrid" style="margin-top:10px">'+['Po','Út','St','Čt','Pá','So','Ne'].map(function(x){return '<span>'+x+'</span>'}).join('')+w.map(function(s,i){return '<div class="'+(s=='t'?'f t':s)+'">'+(2+i)+'</div>'}).join('')+'</div>'}
 if(P==2){var m=state.month,len=m==10?7:new Date(2026,m+1,0).getDate(),k=0;for(var d=1;d<=len;d++)if(dayState(m,d)=='g')k++;
  return '<div class="row" style="margin-top:4px"><span class="ib" data-mstep="-1">'+ic('chevron-left')+'</span><div class="sp" style="text-align:center"><b>'+MN[m]+' 2026</b><div class="cap" style="margin:0">'+k+' z '+len+' dní</div></div><span class="ib'+(m>=10?' dis':'')+'" data-mstep="1">'+ic('chevron-right')+'</span></div>'+monthGrid(m)+'<div class="cap">Klepni na den a uvidíš, co jsi ten den udělal.</div>'}
 var h='<div class="stat">251 z 311 dní</div><div class="ygrid">'+MN.map(function(n,i){var v=MP[i];return '<div class="'+(i==state.ymonth?'sel ':'')+(v==null?'f':'')+'" data-m="'+i+'" style="'+(v==null?'':'background:color-mix(in srgb,var(--green) '+Math.max(15,(v-55)*2.6)+'%,var(--raised))')+'"><b>'+n.slice(0,3)+'</b>'+(v==null?'–':v+' %')+'</div>'}).join('')+'</div>';
 if(state.ymonth!=null&&MP[state.ymonth]!=null){h+='<div class="expand"><div class="row"><b class="sp">'+MN[state.ymonth]+'</b><span class="cap" style="margin:0">'+MP[state.ymonth]+' % dní</span></div>'+monthGrid(state.ymonth)+'</div>'}else{h+='<div class="cap" style="margin-top:8px">Klepni na měsíc a rozbalí se jeho dny.</div>'}return h}
var screens=[
 {name:'Dnes',variants:[
  {name:'A · Jeden fokus',note:'Nahoře kroužek dne a jeden další slib s tlačítkem. Pod tím krátký seznam. Všechny ostatní karty (příběhy, reflexe, návrat, přátelé) jsou v jedné vodorovné řadě „Pro tebe“. Statistický pruh se stěhuje do Statistik.',
   html:function(){return head('Dnes','Sobota 7. 11.',true)+
   '<div class="card"><div class="row"><div class="ring"><div><b>3/5</b><span>dodrženo</span></div></div><div><div class="lab">Na řadě</div><div style="font-size:18px;font-weight:800;margin:4px 0 2px">Gym: záda</div><div class="cap">do 18:00 · 60 min</div></div></div><div class="btn g" style="margin-top:14px">SPLNIL JSEM</div></div>'+
   '<div class="carousel"><div class="mini">'+ic('sparkles')+'<b>Týden je hotový</b>8 z 10 slibů</div><div class="mini">'+ic('users')+'<b>Petr tě šťouchl</b>před 5 min</div><div class="mini">'+ic('notebook')+'<b>Sebereflexe</b>Týden 44</div><div class="mini">'+ic('bulb')+'<b>Návrh</b>Čtení 20 min</div></div>'+
   '<div class="card"><div class="lab">Zbytek dne</div>'+task('book','Čtení','20 min')+task('briefcase','Práce na Kept','do 21:00')+task('run','Ranní běh','splněno 7:10',true)+'</div>'+
   '<div class="btn s" style="margin-top:14px">'+ic('plus')+'&nbsp;PŘIDAT ÚKOL</div>'}},
  {name:'B · Časová osa',note:'Den jako časová osa s čárou „teď“. Úkoly stojí tam, kdy mají deadline, bez deadlinu dole „Kdykoli dnes“. Karty se ukážou jen jako tenký pruh, když jsou opravdu aktuální (třeba večer bilance).',
   html:function(){return head('Dnes','Sobota 7. 11.',true)+
   '<div class="row" style="margin-top:12px;gap:8px"><span class="pill">'+ic('circle-check')+'3 z 5</span><span class="pill">'+ic('flame')+'série 5</span><span class="pill">'+ic('plus')+'Úkol</span></div>'+
   '<div class="tl"><div class="ln"></div>'+
   '<div class="t" style="top:10px">7:00</div><div class="slot d">Ranní běh<small>splněno 7:10</small></div>'+
   '<div class="t" style="top:72px">12:00</div><div class="slot">Oběd bez telefonu<small>do 13:00 · 30 min</small></div>'+
   '<div class="now" style="top:132px"></div>'+
   '<div class="t" style="top:150px">18:00</div><div class="slot" style="margin-top:26px;border-color:var(--orange)">Gym: záda<small>do 18:00 · 60 min · za 2 h</small></div>'+
   '<div class="t" style="top:214px">21:00</div><div class="slot">Práce na Kept<small>do 21:00</small></div></div>'+
   '<div class="card" style="padding:12px 14px"><div class="lab">Kdykoli dnes</div>'+task('book','Čtení','20 min')+'</div>'+
   '<div class="card" style="padding:12px 14px;border-color:var(--orange)"><div class="row"><div>'+ic('moon')+'</div><div class="sp" style="font-size:13.5px">Večer: uzavři dnešek</div><div class="pill">Otevřít</div></div></div>'}},
  {name:'C · Jen seznam',note:'Nejčistší varianta: hlavička, tenký pruh dne a seznam slibů se zaškrtávátky (Kritické nahoře). Všechno ostatní žije ve zvonečku, který už příběhy, reflexi i přátele umí.',
   html:function(){return head('Dnes','Sobota 7. 11.',true)+
   '<div style="margin-top:14px"><div class="row"><div class="sp cap">Dodrženo 3 z 5</div><div class="cap">60 %</div></div><div class="bar"><div style="width:60%;background:var(--green)"></div></div></div>'+
   '<div class="card"><div class="lab" style="color:var(--red)">Kritické</div>'+task('barbell','Gym: záda','do 18:00 · 60 min')+'</div>'+
   '<div class="card"><div class="lab">Ostatní</div>'+task('book','Čtení','20 min')+task('briefcase','Práce na Kept','do 21:00')+task('salad','Oběd bez telefonu','do 13:00')+task('run','Ranní běh','splněno 7:10',true)+'</div>'+
   '<div class="btn s" style="margin-top:14px">'+ic('plus')+'&nbsp;PŘIDAT ÚKOL</div>'}}
 ]},
 {name:'Týden',variants:[
